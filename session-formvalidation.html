<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <section class="container-fluid p-4">
        <div class="row d-flex justify-content-center ">
            <div class="col-md-6 col-lg-5 border border-dark border-opacity-25 p-4 border-2 rounded-2 mt-5">
                <form id="signup-form">
                    <div class="d-flex justify-content-center mb-5">
                        <h1 class="text-primary">Create account</h1>
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Full Name</label>
                        <input type="text" class="form-control border border-dark border-opacity-25"
                            id="name" aria-describedby="emailHelp">
                            <div id="name-error" class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control border border-dark border-opacity-25"
                            id="email" aria-describedby="emailHelp">
                             <div id="email-error" class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label ">Password</label>
                        <input type="password" class="form-control border border-dark border-opacity-25"
                            id="password">
                             <div id="password-error" class="text-danger small mt-1"></div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label ">Confirm Password</label>
                        <input type="password" class="form-control border border-dark border-opacity-25"
                            id="confirm-password">
                             <div id="confirm-error" class="text-danger small mt-1"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create Account</button>
                    <div id="success-message" class="alert alert-success mt-3 d-none"></div>
                </form>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
        <script src="session-formvalidation.js"></script>
</body>

</html>
